<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0d1709" />
  <meta name="description" content="戴夫的后院 · 僵尸图鉴：查看每种僵尸的 3D 模型、走路动画和不同视角。" />
  <title>僵尸图鉴 · 戴夫的后院</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='14' cy='14' r='10' fill='%237ed321'/%3E%3Crect x='21' y='11' width='9' height='6' rx='3' fill='%238ede2a'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="galleryApp">
    <canvas id="galleryCanvas"></canvas>
    <div id="galleryVignette"></div>

    <header class="gallery-header">
      <a class="back-link" href="./index.html">← 返回游戏</a>
      <div class="gallery-title">
        <div class="kicker">ZOMBIE CODEX</div>
        <h1>僵尸图鉴</h1>
      </div>
      <div class="header-spacer" aria-hidden="true"></div>
    </header>

    <aside class="type-panel" id="typePanel" aria-label="僵尸类型">
      <div class="panel-caption">全部僵尸</div>
      <div class="type-list" id="typeList"></div>
    </aside>

    <section class="info-panel" id="infoPanel" aria-live="polite"></section>

    <nav class="angle-bar" id="angleBar" aria-label="观察角度"></nav>
    <div class="gallery-hint">拖动旋转 · 滚轮 / 双指缩放</div>

    <div class="loading" id="loading">
      <div class="spinner" aria-hidden="true"></div>
      <p>正在加载僵尸模型…</p>
    </div>
    <div class="error hidden" id="error" role="alert"></div>
  </div>
  <script type="module" src="/src/gallery/main.js"></script>
</body>
</html>
