<!doctype html><!--
  【页面外壳中文解读】
  这个 HTML 只是"场景的外壳"：一块全屏 canvas、加载进度条、开始菜单、控制说明、
  画质档位按钮、统计行，以及它们的样式与状态机。build.mjs 会把 script 标签里那个
  SCRIPT 占位符替换成拼接压缩后的 JS，其余部分原样保留。

  页面状态由 <body> 的 class 表达（见下方 CSS 与 main.js 的 ui()）：
    l        加载中（canvas 完全透明，显示进度条）
    m        菜单中（canvas 被 CSS 模糊+变暗，场景其实一直在后台渲染）
    g        已进入场景；g p 表示鼠标被 pointer lock 捕获
    l e      启动失败（显示错误文字，隐藏进度条）

  一个反直觉但很聪明的设计：菜单出现时场景【并不停止渲染】，只是被 CSS 模糊掉。
  这样动态分辨率/绘制距离的自动调优在用户还没"Dive in"之前就已经收敛了，
  用户真正下水时基本已经是稳定帧率。
